<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>GRIND N GOLD Checkout</title>

<link rel="stylesheet" href="style.css">

<style>

.checkout-page{
    padding:60px 7%;
    display:flex;
    justify-content:center;
}

.checkout-container{
    width:100%;
    max-width:1100px;
    display:grid;
    grid-template-columns:1fr 350px;
    gap:40px;
}

.checkout-form,
.order-summary{
    background:#111;
    border:1px solid #222;
    border-radius:10px;
    padding:30px;
}

.checkout-form h1,
.order-summary h2{
    color:#d4af37;
    margin-bottom:25px;
}

.checkout-form label{
    display:block;
    color:#aaa;
    margin-top:18px;
    margin-bottom:8px;
}

.checkout-form input,
.checkout-form select{
    width:100%;
    padding:12px;
    background:#080808;
    color:white;
    border:1px solid #333;
    border-radius:5px;
    box-sizing:border-box;
}

.summary-item{
    display:flex;
    justify-content:space-between;
    margin-bottom:15px;
    color:white;
}

.total{
    margin-top:20px;
    padding-top:20px;
    border-top:1px solid #333;
    display:flex;
    justify-content:space-between;
    font-size:22px;
    font-weight:bold;
    color:#d4af37;
}

.payment-button{
    width:100%;
    margin-top:30px;
    padding:15px;
    background:#d4af37;
    color:black;
    border:none;
    border-radius:5px;
    font-weight:bold;
    font-size:16px;
    cursor:pointer;
}

@media(max-width:800px){

.checkout-container{
    grid-template-columns:1fr;
}

}

</style>

</head>

<body>

<nav>

<a href="index.html" class="logo">GRIND N GOLD</a>

<a href="cart.html" class="cart">Cart</a>

</nav>

<section class="checkout-page">

<div class="checkout-container">

<div class="checkout-form">

<h1>Checkout</h1>

<label>Full Name</label>
<input type="text" id="fullName"> 

<label>Email</label>
<input type="email" id="email"> 

<label>Phone Number</label>
<input type="tel" id="phone"> 

<label>Street Address</label>
<input type="text" id="address"> 

<label>Apartment (Optional)</label>
<input type="text" id="apartment"> 

<label>City</label>
<input type="text" id="city">

<label>State</label>
<input type="text" id="state">

<label>ZIP Code</label>
<input type="text" id="zip"> 

<label>Country</label>

<select id="country"> 

<option>United States</option>
<option>Canada</option>
<option>United Kingdom</option>
<option>Australia</option>
<option>Trinidad and Tobago</option>

</select>

</div>

<div class="order-summary">

<h2>Order Summary</h2>

<div id="orderItems"></div>

<div class="total">

<span>Total</span>

<span id="orderTotal">$0.00</span>

</div>

<button class="payment-button"
onclick="validateCheckout()"> 

Proceed to Payment

</button>

<div id="paypal-button-container"
style="margin-top:20px; display:none;">
</div>

</div>

</section>

<script
src="https://www.paypal.com/sdk/js?client-id=BAAt0kptGLZwfJ5HVOXJf76OYT8NK798V0LxI5GmytXOUCDH_DVNGr3bhFQEjlMdH95W92c_Y4N2AhGpGQ
&currency=USD"></script> 

<script>

let cart = JSON.parse(localStorage.getItem("cart")) || [];

let orderItems = document.getElementById("orderItems");

let total = 0;

cart.forEach(product => {

    total += product.price * product.quantity;

    orderItems.innerHTML += `
        <div class="summary-item">
            <span>${product.name} x${product.quantity}</span>
            <span>$${(product.price * product.quantity).toFixed(2)}</span>
        </div>
    `;

});

document.getElementById("orderTotal").innerHTML = "$" + total.toFixed(2);


function validateCheckout() {

    let name = document.getElementById("fullName").value.trim();
    let email = document.getElementById("email").value.trim();
    let phone = document.getElementById("phone").value.trim();
    let address = document.getElementById("address").value.trim();
    let city = document.getElementById("city").value.trim();
    let state = document.getElementById("state").value.trim();
    let zip = document.getElementById("zip").value.trim();

    if (
        name === "" ||
        email === "" ||
        phone === "" ||
        address === "" ||
        city === "" ||
        state === "" ||
        zip === ""
    ) {

        alert("Please complete all required fields.");

        return;

    }

    if (!email.includes("@") || !email.includes(".")) {

        alert("Please enter a valid email address.");

        return;

    }

let order = {

    customer: {
        name: name,
        email: email,
        phone: phone,
        address: address,
        city: city,
        state: state,
        zip: zip,
        country: document.getElementById("country").value
    },

    products: cart,

    total: total

};


localStorage.setItem("order", JSON.stringify(order));

document.getElementById("paypal-button-container").style.display = "block";
}
paypal.Buttons({

    createOrder: function(data, actions) {

        return actions.order.create({

            purchase_units: [{
                amount: {
                    value: total.toFixed(2)
                }
            }]

        });

    },

    onApprove: function(data, actions) {

        return actions.order.capture().then(function(details) {

            alert("Payment successful! Thank you " + details.payer.name.given_name + "!");

        });

    }

}).render('#paypal-button-container');
</script>

</body>

</html>
