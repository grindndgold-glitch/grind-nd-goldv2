<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>GRIND N GOLD Cart</title>

<link rel="stylesheet" href="style.css">

<style>

.cart-page{
    padding:60px 7%;
    display:flex;
    justify-content:center;
}

.cart-container{
    max-width:950px;
    width:100%;
    background:#111;
    padding:30px;
    border-radius:10px;
    border:1px solid #222;
}

.cart-container h1{
    color:#d4af37;
    margin-bottom:30px;
}

.cart-item{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:20px;
    background:#080808;
    padding:20px;
    border-radius:10px;
    margin-bottom:20px;
}

.cart-left{
    display:flex;
    align-items:center;
    gap:20px;
}

.cart-item img{
    width:120px;
    height:120px;
    object-fit:contain;
    background:#111;
    border-radius:8px;
}

.cart-info h2{
    color:white;
    margin-bottom:10px;
}

.cart-info p{
    color:#aaa;
    margin:6px 0;
}

.quantity-control{
    display:flex;
    align-items:center;
    gap:10px;
    margin-top:10px;
}

.quantity-control button{
    width:32px;
    height:32px;
    border:none;
    border-radius:5px;
    background:#d4af37;
    cursor:pointer;
    font-size:18px;
    font-weight:bold;
}

.remove-button{
    background:crimson;
    color:white;
    border:none;
    padding:10px 15px;
    border-radius:5px;
    cursor:pointer;
}

.total{
    color:#d4af37;
    font-size:26px;
    font-weight:bold;
    text-align:right;
    margin-top:30px;
}

.checkout-button{
    display:block;
    margin-top:25px;
    background:#d4af37;
    color:black;
    text-align:center;
    padding:14px;
    border-radius:5px;
    text-decoration:none;
    font-weight:bold;
}

@media(max-width:700px){

.cart-item{
    flex-direction:column;
    align-items:flex-start;
}

.cart-left{
    flex-direction:column;
    align-items:flex-start;
}

}

</style>

</head>

<body>

<nav>

<a href="index.html" class="logo">
GRIND N GOLD
</a>

<a href="shop.html" class="cart">
Shop
</a>

</nav>

<section class="cart-page">

<div class="cart-container">

<h1>Your Cart</h1>

<div id="cartItems"></div>

<div id="totalPrice" class="total"></div>

<a href="checkout.html" class="checkout-button">
CHECKOUT
</a>

</div>

</section>

<script>

let cart = JSON.parse(localStorage.getItem("cart")) || [];

function displayCart() {

    let cartItems = document.getElementById("cartItems");
    let totalPrice = document.getElementById("totalPrice");

    if (cart.length === 0) {

        cartItems.innerHTML = "<p style='color:white;'>Your cart is empty.</p>";
        totalPrice.innerHTML = "";

        return;

    }

    cartItems.innerHTML = "";

    let total = 0;

    cart.forEach((product, index) => {

        total += product.price * product.quantity;

        cartItems.innerHTML += `

        <div class="cart-item">

            <div class="cart-left">

                <img src="${product.image}">

                <div class="cart-info">

                    <h2>${product.name}</h2>

                    <p>Price: $${product.price.toFixed(2)}</p>

                    <div class="quantity-control">

                        <button onclick="changeQuantity(${index}, -1)">-</button>

                        <p>${product.quantity}</p>

                        <button onclick="changeQuantity(${index}, 1)">+</button>

                    </div>

                </div>

            </div>

            <button class="remove-button" onclick="removeItem(${index})">
                Remove
            </button>

        </div>

        `;

    });

    totalPrice.innerHTML = "Total: $" + total.toFixed(2);

}

function changeQuantity(index, amount) {

    cart[index].quantity += amount;

    if (cart[index].quantity < 1) {
        cart[index].quantity = 1;
    }

    localStorage.setItem("cart", JSON.stringify(cart));

    displayCart();

}

function removeItem(index) {

    cart.splice(index, 1);

    localStorage.setItem("cart", JSON.stringify(cart));

    displayCart();

}

displayCart();

</script>

</body>

</html>
