<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>GRIND N GOLD Cart</title>

<link rel="stylesheet" href="style.css">

<style>

.cart-page {
    padding: 60px 7%;
    display: flex;
    justify-content: center;
}

.cart-container {
    max-width: 900px;
    width: 100%;
    background: #111;
    padding: 30px;
    border-radius: 10px;
    border: 1px solid #222;
}

.cart-container h1 {
    color: #d4af37;
    margin-bottom: 30px;
}


.cart-item {

    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 20px;

    background: #080808;
    padding: 20px;
    border-radius: 10px;
    margin-bottom: 20px;

}


.cart-item img {

    width: 120px;
    height: 120px;
    object-fit: contain;
    border-radius: 8px;

}


.cart-info h2 {

    color: white;

}


.cart-info p {

    color: #aaa;

}


.quantity-control {

    display: flex;
    align-items: center;
    gap: 10px;

}


.quantity-control button {

    width: 30px;
    height: 30px;
    background: #d4af37;
    border: none;
    cursor: pointer;
    font-weight: bold;

}


.remove-button {

    background: crimson;
    color: white;
    border: none;
    padding: 8px;
    cursor: pointer;
    border-radius: 5px;

}


.total {

    color: #d4af37;
    font-size: 24px;
    font-weight: bold;
    margin-top: 30px;

}


.checkout-button {

    display: block;
    margin-top: 25px;
    background: #d4af37;
    color: black;
    text-align: center;
    padding: 14px;
    border-radius: 5px;
    font-weight: bold;

}


</style>

</head>


<body>


<nav>

<a href="index.html" class="logo">
GRIND N GOLD
</a>


<a href="shop.html" class="cart">
Shop
</a>

</nav>



<section class="cart-page">


<div class="cart-container">


<h1>Your Cart</h1>


<div id="cartItems">

</div>


<div class="total" id="totalPrice">

</div>


<a href="checkout.html" class="checkout-button">
CHECKOUT
</a>


</div>


</section>



<script>


let cart = JSON.parse(localStorage.getItem("cart"));


function displayCart(){


let cartItems = document.getElementById("cartItems");


if(!cart){

cartItems.innerHTML = "<p>Your cart is empty.</p>";

document.getElementById("totalPrice").innerHTML = "";

return;

}



cartItems.innerHTML = `

<div class="cart-item">


<img src="${cart.image}">


<div class="cart-info">

<h2>${cart.name}</h2>

<p>Price: $${cart.price}</p>


<div class="quantity-control">

<button onclick="changeQuantity(-1)">-</button>

<p>${cart.quantity}</p>

<button onclick="changeQuantity(1)">+</button>

</div>


</div>


<button class="remove-button" onclick="removeItem()">
Remove
</button>


</div>

`;


let total = cart.price * cart.quantity;


document.getElementById("totalPrice").innerHTML =
"Total: $" + total.toFixed(2);


}



function changeQuantity(amount){


cart.quantity = Number(cart.quantity) + amount;


if(cart.quantity < 1){

cart.quantity = 1;

}


localStorage.setItem("cart", JSON.stringify(cart));


displayCart();


}



function removeItem(){


localStorage.removeItem("cart");


cart = null;


displayCart();


}



displayCart();


</script>


</body>

</html>
