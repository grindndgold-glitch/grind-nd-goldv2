<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Shop | GRIND N GOLD</title>

<link rel="stylesheet" href="style.css">

<style>
.shop-container {
    padding: 50px 7%;
}

.shop-title {
    text-align: center;
    color: #d4af37;
    letter-spacing: 4px;
    margin-bottom: 40px;
}

.products-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
    gap: 20px;
}

.card {
    background: #111;
    border: 1px solid #222;
    border-radius: 10px;
    overflow: hidden;
    transition: 0.3s;
}

.card:hover {
    transform: translateY(-5px);
    border-color: #d4af37;
}

.image-box {
    height: 180px;
    background: #080808;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 15px;
}

.image-box img {
    width: 100%;
    height: 100%;
    object-fit: contain;
}

.product-details {
    padding: 15px;
}

.tag {
    color: #999;
    font-size: 12px;
    text-transform: uppercase;
}

.product-details h3 {
    margin: 10px 0;
    font-size: 17px;
}

.price {
    color: #d4af37;
    font-size: 20px;
    font-weight: bold;
}

.discount {
    color: #777;
    text-decoration: line-through;
    margin-left: 8px;
    font-size: 13px;
}

.buy-btn {
    display: block;
    margin-top: 15px;
    background: #d4af37;
    color: black;
    text-align: center;
    padding: 10px;
    border-radius: 5px;
    font-weight: bold;
}

.search-box{
    display:flex;
    justify-content:center;
    margin-bottom:35px;
}

.search-box input{
    width:100%;
    max-width:450px;
    padding:14px 18px;
    background:#111;
    color:white;
    border:1px solid #333;
    border-radius:30px;
    outline:none;
    font-size:16px;
    transition:.3s;
}

.search-box input:focus{
    border-color:#d4af37;
    box-shadow:0 0 10px rgba(212,175,55,.25);
}
    
</style>

</head>


<body>


<nav>

<a href="index.html" class="logo">
GRIND N GOLD
</a>

<ul class="nav-links">

<li><a href="index.html">Home</a></li>

<li><a href="shop.html">Shop</a></li>

<li><a href="index.html#about">About</a></li>

</ul>

<a href="#" class="cart">
Cart (0)
</a>

</nav>



<section class="shop-container">

<h1 class="shop-title">
SHOP
</h1>

<div class="search-box">

<input
type="text"
id="searchInput"
placeholder="search products..."> 
</div> 


<div class="products-grid">


<div class="card" data-name="grind n gold classic watch watches"> 


<div class="image-box">

<img src="watch1.jpg" alt="GRIND N GOLD Watch">

</div>


<div class="product-details">

<span class="tag">
Watches
</span>


<h3>
GRIND N GOLD Classic Watch
</h3>


<span class="price">
$29.99
</span>

<span class="discount">
$49.99
</span>


<a href="product.html" class="buy-btn">
BUY NOW
</a>


</div>


</div>


</div>


</section>



<footer>

<h2>
GRIND N GOLD
</h2>

<p>
Keep grinding. Keep moving. Keep building.
</p>

</footer>
    
<script>

const searchInput = document.getElementById("searchInput");
const products = document.querySelectorAll(".card");

searchInput.addEventListener("keyup", function () {

    let search = searchInput.value.toLowerCase();

    products.forEach(function(product) {

        let name = product.dataset.name.toLowerCase();

        if (name.includes(search)) {
            product.style.display = "block";
        } else {
            product.style.display = "none";
        }

    });

});

</script>

</body>

</html>
