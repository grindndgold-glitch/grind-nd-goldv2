<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>My Grind | GRIND N GOLD</title>

<link rel="stylesheet" href="style.css">

<style>

.grind-page{
    padding:60px 7%;
    max-width:900px;
    margin:auto;
}

.grind-page h1{
    color:#d4af37;
    text-align:center;
    margin-bottom:10px;
}

.grind-page p{
    text-align:center;
    color:#999;
    margin-bottom:35px;
}

.goal-input{
    display:flex;
    gap:10px;
    margin-bottom:30px;
}

.goal-input input{
    flex:1;
    padding:14px;
    background:#111;
    color:white;
    border:1px solid #333;
    border-radius:6px;
}

.goal-input button{
    padding:14px 22px;
    background:#d4af37;
    color:black;
    border:none;
    border-radius:6px;
    font-weight:bold;
    cursor:pointer;
}

.goal{
    background:#111;
    border:1px solid #222;
    border-radius:8px;
    padding:18px;
    margin-bottom:15px;
    display:flex;
    justify-content:space-between;
    align-items:center;
}

.goal.completed{
    opacity:.6;
    text-decoration:line-through;
}

.goal button{
    width:40px;
    height:40px;
    background:#d4af37;
    color:black;
    border:none;
    border-radius:8px
    font-size:18px;
    font-weight:bold;
    cursor:pointer;
    margin-left:8px;
    transition:0.3s;
}

.goal button:hover{
    background:#f0d878;
    transform:scale(1.05);
}

.stats{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:15px;
    margin-bottom:35px;
}

.stat-box{
    background:#111;
    border:1px solid #222;
    border-radius:10px;
    padding:20px;
    text-align:center;
    transition:.3s; 
}

.stat-box:hover{
    transform:translateY(-5px);
    border-color:#d4af37;
}

.stat-box h2{
    color:#d4af37;
    font-size:32px;
    margin-bottom:8px;
}

.stat-box p{
    color:#999;
    margin:0;
}

.quote-box{
    background:#111;
    border:1px solid #222;
    border-radius:10px;
    padding:20px;
    margin-bottom:30px;
    text-align:center;
    color:#d4af37;
    font-style:italic;
    font-size:18px;
}

@media(max-width:700px){

.stats{
    grid-template-columns:1fr;
}

.goal-input{
    flex-direction:column;
}

.goal{
    flex-direction:column;
    align-items:flex-start;
    gap:15px;
}

}

</style>

</head>

<body>

<nav>

<a href="index.html" class="logo">
GRIND N GOLD
</a>

<ul class="nav-links">

<li><a href="index.html">Home</a></li>

<li><a href="shop.html">Shop</a></li>

<li><a href="index.html#about">About</a></li>

</ul>

<a href="cart.html" class="cart" id="cartCount">
Cart (0)
</a>

</nav>

<section class="grind-page">

<h1>MY GRIND</h1>

<p>
Every goal starts with one step.
Keep grinding. Keep building.
</p>
    
<div id="dailyQuote" class="quote-box"></div>

<div class="goal-input">

<input
type="text"
id="goalInput"
placeholder="What are you working towards?">

<button onclick="addGoal()">
ADD
</button>

</div>

<div class="stats">

<div class="stat-box">
<h2 id="goalCount">0</h2>
<p>Goals</p>
</div>

<div class="stat-box">
<h2 id="completedCount">0</h2>
<p>Completed</p>
</div>

<div class="stat-box">
<h2 id="averageProgress">0%</h2>
<p>Average Progress</p>
</div>

</div>

<div id="goalList"></div> 

</section>

<footer>

<h2>
GRIND N GOLD
</h2>

<p>
Keep grinding. Keep moving. Keep building.
</p>

</footer>

<script>

let goals = JSON.parse(localStorage.getItem("goals")) || [];

function saveGoals(){

    localStorage.setItem("goals", JSON.stringify(goals));

}

function renderGoals(){

    let list = document.getElementById("goalList");

    list.innerHTML = "";

    goals.forEach(function(goal,index){

list.innerHTML += `

<div class="goal ${goal.done ? "completed" : ""}">

<div style="width:100%;">

<h3>${goal.text}</h3>

<div style="
width:100%;
height:10px;
background:#222;
border-radius:10px;
overflow:hidden;
margin:10px 0;">

<div style="
width:${goal.progress || 0}%;
height:100%;
background:${
(goal.progress || 0) < 40
? "#ff4d4d"
: (goal.progress || 0) < 70
? "#f0ad4e"
: "#28a745"
};
</div>

</div>

<p style="color:#999;">
${goal.progress || 0}% Complete
</p>

<div>

<button onclick="changeProgress(${index},-10)">-</button>

<button onclick="changeProgress(${index},10)">+</button>

<button onclick="toggleGoal(${index})">
✅
</button>

<button onclick="deleteGoal(${index})">
🗑️
</button>

</div>

</div>

</div>

`;

    });

}

function addGoal(){

    let input = document.getElementById("goalInput");

    if(input.value.trim() === ""){

        alert("Enter a goal first.");

        return;

    }

    goals.push({

        text: input.value,
        
        done: false,
        
        progress: 0,

    });

    input.value = "";

    saveGoals();

    renderGoals();

     updateStats();

}

function toggleGoal(index){

    goals[index].done = !goals[index].done;

    saveGoals();

    renderGoals();

     updateStats();

}

function changeProgress(index, amount){

    goals[index].progress += amount;

    if(goals[index].progress < 0){
        goals[index].progress = 0;
    }

    if(goals[index].progress > 100){
        goals[index].progress = 100;
    }

    saveGoals();

    renderGoals();

     updateStats();

}

function deleteGoal(index){

    goals.splice(index,1);

    saveGoals();

    renderGoals();

    updateStats();

}

function updateStats(){

    let completed = 0;
    let progress = 0;

    goals.forEach(function(goal){

        if(goal.done){
            completed++;
        }

        progress += goal.progress || 0;

    });

    let average = 0;

    if(goals.length > 0){
        average = Math.round(progress / goals.length);
    }

    document.getElementById("goalCount").textContent = goals.length;

    document.getElementById("completedCount").textContent = completed;

    document.getElementById("averageProgress").textContent =
    average + "%";

}

const quotes=[

"Discipline beats motivation.",

"Success is earned.",

"Dream big. Work bigger.",

"The grind never lies.",

"Small progress every day becomes big results.",

"Stay hungry. Stay humble.",

"Keep showing up.",

"The future belongs to the disciplined.",

"You become what you repeat.",

"Keep grinding. Keep building."

];

function loadQuote(){

let random=Math.floor(Math.random()*quotes.length);

document.getElementById("dailyQuote").textContent=quotes[random];

}

function updateCartCount(){

    let cart = JSON.parse(localStorage.getItem("cart")) || [];

    let totalItems = 0;

    cart.forEach(function(product){

        totalItems += product.quantity;

    });

    document.getElementById("cartCount").textContent =
    "Cart (" + totalItems + ")";

}

renderGoals();

updateStats();

loadQuote();

updateCartCount();

</script>

</body>

</html>
